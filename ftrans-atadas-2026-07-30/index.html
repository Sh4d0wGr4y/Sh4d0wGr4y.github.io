<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>F TRANS – átadás betöltése</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#071b12;color:#fff}.box{text-align:center;padding:28px}.logo{display:inline-block;padding:10px 20px;border-radius:14px;background:linear-gradient(145deg,#31d978,#118847);font-family:"Cooper Black",Cooper,Georgia,serif;font-size:30px;font-weight:900}p{color:#c7d9ce}
</style>
</head>
<body>
<div class="box"><div class="logo">F TRANS</div><p>Az átadás betöltése…</p></div>
<script>
(async () => {
  const files = [
    "data/part01.b64","data/part02.b64","data/part03.b64",
    "data/part04.b64","data/part05.b64","data/part06.b64",
    "data/part07.b64","data/part08.b64","data/part09.b64"
  ];
  const decode = b64 => {
    const bin = atob(b64.trim());
    const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
  };
  try {
    const parts = await Promise.all(files.map(async file => {
      const response = await fetch(file, {cache:"no-store"});
      if (!response.ok) throw new Error(file + ": " + response.status);
      return decode(await response.text());
    }));
    document.open();
    document.write(parts.join(""));
    document.close();
  } catch (error) {
    document.body.innerHTML = '<div class="box"><div class="logo">F TRANS</div><p>Az oldal betöltése nem sikerült. Kérjük, próbálja újra.</p></div>';
    console.error(error);
  }
})();
</script>
</body>
</html>
